[build]
# 프론트엔드 빌드 → backend/static 에 출력, 이후 Python 의존성 설치
buildCommand = "cd frontend && npm ci && npm run build && cd ../backend && pip install -r requirements.txt"

[deploy]
startCommand = "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1"
healthcheckPath = "/healthz"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
